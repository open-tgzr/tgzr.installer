[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "tgzr.installer"
dynamic = ["version"]
description = 'A plugin to install TGZR with tgzr cli.'
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
keywords = []
authors = [{ name = "Dee", email = "dee.sometech@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]

dependencies = ["tgzr.cli", "uv>=0.9.15"]

[project.optional-dependencies]
dev = ["pyinstaller>=6.17.0"]

[project.entry-points."tgzr.cli.plugin"]
installer_cli = "tgzr.installer.cli_plugins:install_cli_plugins"

[project.urls]
Documentation = "https://github.com/open-tgzr/tgzr.installer#readme"
Issues = "https://github.com/open-tgzr/tgzr.installer/issues"
Source = "https://github.com/open-tgzr/tgzr.installer"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "./src/tgzr/installer/_version.py"

[tool.hatch.build]
# this is needed bc it is otherwise not included in the build:
artifacts = ['_version.py']
packages = ["src/tgzr"]

[tool.hatch.build.targets.wheel]
# this is needed bc it is otherwise not included in the build:
artifacts = ['_version.py']
packages = ["src/tgzr"]
